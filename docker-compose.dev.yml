# Development stack: bind mounts + live reloading (node --watch via the
# @swc-node/register hook / ng serve).
# Usage: docker compose -f docker-compose.dev.yml up --build
name: transcendence-dev

services:
  backend:
    image: transcendence-backend:dev
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Same image as prod; the SWC register hook (a runtime dep) provides
    # `npm run watch`.
    command: npm run watch
    volumes:
      - ./shared:/app/shared:z
      - ./backend:/app/backend:z
    ports:
      - "8080:8080"
    env_file:
        - ".env"
    environment:
      NODE_ENV: "development"
      DATABASE_URL: postgres://transcendence:transcendence@db:5432/transcendence
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: transcendence
      POSTGRES_PASSWORD: transcendence
      POSTGRES_DB: transcendence
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/01-create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transcendence -d transcendence"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    volumes:
      - ./shared:/app/shared:z
      - ./frontend:/app/frontend:z
    ports:
      - "4200:4200"
    depends_on:
      - backend

volumes:
  db_data: