# WebSocket upgrade for socket.io polling/websocket transports
map $http_upgrade $connection_upgrade {
	default upgrade;
	""      close;
}

server {
	listen 80;

	root /usr/share/nginx/html;
	index index.html;

	# Resolve docker-compose DNS per request so a backend restart
	# doesn't leave nginx with a stale IP.
	resolver 127.0.0.11 valid=10s ipv6=off;

	location /socket.io/ {
		set $backend http://backend:8080;
		proxy_pass $backend;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header Host $host;
		# Keep long-lived game sockets open past nginx's default 60s read timeout.
		proxy_read_timeout 1h;
	}

	location / {
		try_files $uri $uri/ /index.html;
	}
}
