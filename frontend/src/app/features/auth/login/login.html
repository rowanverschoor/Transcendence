<section class="auth-card">
  <h1>Log in</h1>

  <form (submit)="onSubmit($event)" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username"
        [attr.aria-invalid]="submitted() && !email()" (input)="onInput('email', $event)" />
      @if (submitted() && !email()) {
        <p class="error">Email is required</p>
      }
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password"
        [attr.aria-invalid]="submitted() && !password()" (input)="onInput('password', $event)" />
      @if (submitted() && !password()) {
        <p class="error">Password is required</p>
      }
    </div>
    @if (serverError()) {
      <p class="form-error" role="alert">{{ serverError() }}</p>
    }
    <button type="submit" class="btn btn--primary">Log in</button>
    <button type="register" class="btn btn--ghost">Register</button>
  </form>
</section>
