<section class="panel">
	<header>
		<h2>WebSocket Test</h2>
		<span class="pill" [class.is-connected]="connected()" [class.is-disconnected]="!connected()">
			{{ connected() ? "Connected" : "Disconnected" }}
		</span>
	</header>
	<p class="hint">Continually sends mouse position to the backend</p>

	<div class="stats">
		<div class="stat">
			<span class="stat-label">Mouse position</span>
			<span class="stat-value mono" #mousepos id="mousepos">X: 0 Y: 0</span>
		</div>
		<div class="stat">
			<span class="stat-label">Last server message</span>
			<span class="stat-value mono">{{ lastMessage() || "—" }}</span>
		</div>
	</div>

	<h3>Event log</h3>
	<div class="log mono" #output id="output"></div>
</section>
