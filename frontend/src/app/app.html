<header class="hud">
  <nav class="hud__links">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="btn btn--ghost">Home</a>
    <a routerLink="/profile" routerLinkActive="active" class="btn btn--ghost">Profile</a>
    <a routerLink="/game" routerLinkActive="active" class="btn btn--ghost">Game</a>
    <a routerLink="/privacy" routerLinkActive="active" class="btn btn--ghost">Privacy</a>
    <a routerLink="/terms" routerLinkActive="active" class="btn btn--ghost">Terms</a>
  </nav>

  <div class="hud__auth">
    @if (auth.currentUser(); as user) {
      <span class="hud__user">{{ user.displayName }}</span>
      <button type="button" class="btn btn--ghost" (click)="auth.logout()">Log out</button>
    } @else {
      <a routerLink="/login" class="btn btn--ghost">Log in</a>
      <a routerLink="/register" class="btn btn--primary">Register</a>
    }
  </div>
</header>
<main>
  <router-outlet />
</main>
