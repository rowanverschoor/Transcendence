name: build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  start:
    name: build (start)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@v5

      # .env is gitignored; compose requires it (env_file) and the backend
      # zod schema refuses the placeholder secret in production.
      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i "s/^SESSION_SECRET=.*/SESSION_SECRET=$(openssl rand -hex 32)/" .env

      - name: Production stack
        run: |
          mise run start
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8081 -o /dev/null &&
               curl -sf "http://localhost:8080/socket.io/?EIO=4&transport=polling" -o /dev/null; then
              echo "production stack is up"
              exit 0
            fi
            sleep 5
          done
          echo "production stack did not come up in time"
          docker compose -f docker-compose.yml ps
          docker compose -f docker-compose.yml logs --tail 50
          exit 1

      - name: Stop production stack
        if: always()
        run: mise run down

  dev:
    name: build (dev)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@v5

      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i "s/^SESSION_SECRET=.*/SESSION_SECRET=$(openssl rand -hex 32)/" .env

      # mise run dev is foreground (no -d): background it, probe, tear down.
      - name: Dev stack
        run: |
          mise run dev > dev.log 2>&1 &
          DEV_PID=$!
          UP=false
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:4200 -o /dev/null &&
               curl -sf "http://localhost:8080/socket.io/?EIO=4&transport=polling" -o /dev/null; then
              UP=true
              break
            fi
            kill -0 $DEV_PID 2>/dev/null || { echo "mise run dev exited early"; break; }
            sleep 5
          done
          if [ "$UP" != true ]; then
            echo "dev stack did not come up in time"
            tail -100 dev.log
            exit 1
          fi
          echo "dev stack is up"

      - name: Stop dev stack
        if: always()
        run: |
          mise run dev-down
          pkill -f "mise run dev" 2>/dev/null || true
