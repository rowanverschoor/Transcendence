name: lint

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        id: eslint
        continue-on-error: true
        run: npx eslint .

      - name: Typecheck backend
        run: npm run check -w backend

      - name: Typecheck frontend
        # `ng test` runs vitest, which only strips types; the build is the
        # frontend's full type check.
        run: npm run check -w frontend

      - name: ESLint result
        # Fail at the end so both typechecks still ran.
        if: always() && steps.eslint.outcome == 'failure'
        run: |
          echo "ESLint failed; see the ESLint step above."
          exit 1
