name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: opencode-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.head.repo.fork != true && github.event.pull_request.draft != true
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run opencode review
        uses: anomalyco/opencode/github@a3b97d9090ccf4aa9ac32268486283e3131e36b4 # github-v1.2.25
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode-go/glm-5.3
          use_github_token: true
          prompt: |
            Review this pull request. Do not modify, commit, or push anything.
            You may run `npm ci`, `npx eslint .`, and workspace builds/tests to ground findings.
            Focus on:
            - Bugs, race conditions, and unhandled error paths
            - TypeScript conventions used in this repo: literal-union types for message
              discriminators, readonly fields, constructor injection, no global singletons
            - Security: input validation, secrets exposure, WebSocket message handling
            Report only real issues; skip style nitpicks already covered by eslint.
            Final answer format: first line "Verdict: LGTM" or "Verdict: Changes requested",
            then a numbered list of findings, each with a `path/to/file.ts:line` reference
            and a one-line fix suggestion.
            If the verdict is "Verdict: LGTM", end the comment with exactly this line:
            <img src="https://static.klipy.com/ii/4493325008d34b7bf8cd6813cd5c1619/67/c5/J1x8j3B5xmh67toPw8Q.gif" alt="Speed Triple T" width="165" height="165">
