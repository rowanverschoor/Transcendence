monorepo_root = true

[settings]
experimental = true

[monorepo]
config_roots = ["frontend", "backend"]

[deps.npm]
auto = true

[tools]
node = "26"

[tasks.dev]
description = "Run the server with watch mode"
run = "npm run dev"

[tasks.start]
description = "Run the server"
run = "npm start"

[tasks.check]
description = "Type-check without emitting"
run = "npm run check"

[tasks.setup]
description = "Automatically pick mise data dir (Codam goinfre vs home)"
run = "bash setup-mise.sh"

