monorepo_root = true

[settings]
experimental = true

[monorepo]
config_roots = ["frontend", "backend"]

[deps.npm]
auto = true

[tools]
node = "26"

[tasks.dev]
description = "Build and run the dev compose stack (bind mounts, live reload)"
run = "mise-tasks/compose.sh -f docker-compose.dev.yml up --build"

[tasks.dev-down]
description = "Stop the dev compose stack"
run = "mise-tasks/compose.sh -f docker-compose.dev.yml down"

[tasks.start]
description = "Build and run the production compose stack"
run = "mise-tasks/compose.sh up --build -d"

[tasks.down]
description = "Stop the production compose stack"
run = "mise-tasks/compose.sh down"

[tasks.check]
description = "Type-check without emitting"
run = "npm run check"

[tasks.setup]
description = "Automatically pick mise data dir (Codam goinfre vs home)"
run = "bash setup-mise.sh"
